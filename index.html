<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#004b4e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // A team's own link (/verovolley, or ?team=verovolley in the installed app's start address) tags
      // this phone for that team's pilot (src/shared/lib/team.ts); the team's manifest makes "Add to
      // Home Screen" keep the tag. Runs before the app so everything after it knows the team.
      ;(function () {
        try {
          var teams = ['verovolley']
          var fromPath = (location.pathname.match(/^\/([a-z]+)\/?$/i) || [])[1]
          var fromQuery = new URLSearchParams(location.search).get('team')
          var team = [fromPath && fromPath.toLowerCase(), fromQuery].filter(function (t) { return teams.indexOf(t) >= 0 })[0]
          if (team) localStorage.setItem('bab.team', team)
          else team = localStorage.getItem('bab.team')
          if (teams.indexOf(team) < 0) return
          document.querySelector('link[rel="manifest"]').setAttribute('href', '/manifest-' + team + '.webmanifest')
          if (fromPath && teams.indexOf(fromPath.toLowerCase()) >= 0) history.replaceState(null, '', '/?team=' + team)
        } catch (e) {}
      })()
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BAB" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Body Language for Athletes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
